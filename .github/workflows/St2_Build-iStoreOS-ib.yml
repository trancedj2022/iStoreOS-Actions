name: 💿 St2_Build-iStoreOS-ib

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "1、请选择设备型号"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: choice
        options:
          - s905l3b-ip103h
      openwrt_kernel:
        description: "2、请选择内核版本"
        required: true
        default: "- 6.18.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核-未匹配则自动"
        required: false
        default: true
        type: boolean
      openwrt_rootfs:
        description: "3、请选择Rootfs通用底包（对应St1的Tag后缀，默认RELEASE）"
        required: true
        default: "RELEASE"
      network_settings:
        description: "4、请选择初始网络配置（static/dhcp）"
        required: true
        default: "dhcp"
        type: choice
        options:
          - static
          - dhcp
      st1_run_number:
        description: "5、输入St1的构建编号 (如: b1，留空则尝试自动匹配最新)"
        required: false
        default: ""

env:
  VERSION: 24.10.5

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⏬ 下载并校验 rootfs.tar.gz
        run: |
          mkdir -p bin/targets/armsr/armv8
          
          # 1. 自动从 GitHub API 获取符合前缀的最新的 Tag (包含 -b 编号)
          # 注意替换为你的用户名和仓库名，或者直接用环境变量
          REPO_URL="https://github.com{{ github.repository }}/releases"
          TAG_PREFIX="iStoreOS-${{ env.VERSION }}-${{ inputs.network_settings }}"
          
          echo "🔍 正在搜索前缀为 $TAG_PREFIX 的最新发布..."
          
          # 使用 grep 提取最新的带编号 Tag
          LATEST_TAG=$(curl -s $REPO_URL | grep -oP "${TAG_PREFIX}-b\d+" | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ 找不到匹配的 Tag，请检查 St1 是否运行成功且版本号一致。"
            exit 1
          fi
          
          echo "✅ 找到最新 Tag: $LATEST_TAG"
          
          # 2. 拼接下载地址并执行下载
          DOWNLOAD_URL="https://github.com{{ github.repository }}/releases/download/${LATEST_TAG}/istoreos-armsr-armv8-generic-rootfs.tar.gz"
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz "$DOWNLOAD_URL"
          
          # 3. 检查文件是否下载成功（非 404）
          if [[ $(head -n 1 bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz) == *"Not Found"* ]]; then
            echo "❌ 下载失败：文件在 Release 中不存在！"
            exit 1
          fi

          # 3. 严格校验文件合法性
          FIRST_LINE=$(head -n 1 bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz)
          if [[ "$FIRST_LINE" == *"Not Found"* ]] || [[ "$FIRST_LINE" == *"{"* ]]; then
            echo "❌ 错误：下载的内容是错误信息而非压缩包！"
            cat bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz
            exit 1
          fi
          echo "✅ 文件校验通过，开始构建..."


      - name: 🔍 查找文件路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 🧱 打包iStoreOS固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 调整.img.gz 文件名
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}/g')
            mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
          done

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          # 对齐 St1：使用带 b+编号 的 Tag 避开不可变锁定
          tag_name: iStoreOS-${{ env.VERSION }}-${{ inputs.openwrt_board }}-${{ inputs.network_settings }}-b${{ github.run_number }}
          name: iStoreOS-${{ env.VERSION }} for ${{ inputs.openwrt_board }} (#${{ github.run_number }})
          body: |
            📌 设备型号：${{ inputs.openwrt_board }}
            🧠 内核版本：${{ inputs.openwrt_kernel }}
            🌐 网络配置：${{ inputs.network_settings }}
            🛠️ 构建流水：#${{ github.run_number }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
