env:
  VERSION: 24.10.8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ 设置可执行权限
        run: |
          chmod +x arm64/build24.sh
          chmod +x shell/*.sh

      - name: ⚙️ 设置IP、网关和版本号
        run: |
          sed -i "s/版本号/${{ env.VERSION }}/g" "./files/etc/uci-defaults/99-custom.sh"
          sed -i "s/版本号/${{ env.VERSION }}/g" "./files/etc/banner"
          echo "当前网络配置路径"
          CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
          echo $CONFIG_PATH
          if [ "${{ inputs.network_settings }}" = "static" ]; then
             echo "删除网络设置-dhcp"
             sed -i '34,111d' "$CONFIG_PATH"
             echo "替换默认配置"
             sed -i "/ipaddr/s/192.168.5.88/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
             sed -i "/gateway/s/192.168.5.1/${{ inputs.gateway }}/g" "$CONFIG_PATH"
          else
             echo "删除网络设置-static"
             sed -i '26,32d' "$CONFIG_PATH"
          fi
          echo "输出配置"
          cat $CONFIG_PATH

      - name: ⏬ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zstd curl unzip tree

      - name: ⏬ 下载 ImageBuilder
        run: |
          curl -L -o imagebuilder.tar.zst https://github.com/Kwonelee/iStoreOS-Actions/releases/download/iStoreOS-ImageBuilder/${{ inputs.build_version }}-istoreos-imagebuilder-armsr-armv8.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
          mv istoreos-imagebuilder-* imagebuilder

      - name: ⏬ 复制并设置必备文件
        run: |
          cp arm64/build24.sh imagebuilder/
          cp shell/*-packages.sh imagebuilder/
          find files/packages/ -name "*.ipk" -exec cp {} imagebuilder/packages/ \;
          
          mkdir -p imagebuilder/files/etc/{uci-defaults,banner1}
          cp files/etc/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
          cp files/etc/banner imagebuilder/files/etc/banner1/
          cp files/etc/rc.local imagebuilder/files/etc/
          
          cd imagebuilder
          echo "启用rootfs.tar.gz配置并停用非必要配置"
          sed -i 's/# CONFIG_TARGET_ROOTFS_TARGZ is not set/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
          sed -i "s|CONFIG_TARGET_ROOTFS_SQUASHFS=.*|# CONFIG_TARGET_ROOTFS_SQUASHFS is not set|g" .config
          sed -i "s|CONFIG_TARGET_IMAGES_GZIP=.*|# CONFIG_TARGET_IMAGES_GZIP is not set|g" .config
          echo "打印action目录结构"
          tree -L 1

      - name: 🧱 构建 iStoreOS-rootfs
        working-directory: ./imagebuilder
        run: |
          echo "打印imagebuilder目录结构"
          tree -L 1
          echo "打印repositories"
          cat repositories.conf
          bash ./build24.sh

      - name: 📦 获取 rootfs 路径
        id: rootfs
        run: |
          ROOTFS=$(find imagebuilder/bin/targets/armsr/armv8/ -name "*generic-rootfs.tar.gz" | head -n1)
          if [ -z "$ROOTFS" ]; then
            echo "❌ 未找到构建生成的 rootfs.tar.gz"
            exit 1
          fi
          echo "✅ Found rootfs: $ROOTFS"
          echo "rootfs_path=$ROOTFS" >> $GITHUB_OUTPUT

      - name: 🧱 打包 iStoreOS 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.rootfs.outputs.rootfs_path }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 调整 .img.gz 文件名
        id: rename
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            echo "Processing file: $FILE"
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed "s/openwrt/istoreos_${{ env.VERSION }}/g")
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed $FILENAME to $NEW_FILENAME"
            else
              echo "No need to rename $FILENAME"
            fi
          done

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-${{ inputs.openwrt_board }}-${{ inputs.network_settings }}
          body: |
            📌 版本： iStoreOS-${{ env.VERSION }}
            📟 设备： ${{ inputs.openwrt_board }}
            🧠 内核： ${{ inputs.openwrt_kernel }}
            🌐 网络： ${{ inputs.network_settings }}
            ${{ inputs.network_settings == 'static' && format('📌 管理IP：{0}  网关：{1}', inputs.ipaddr, inputs.gateway) || '📌 动态获取 IP（DHCP）' }}
            
            🔧 基于 ImageBuilder 构建 rootfs，通过 ophub 打包生成。
            👤 用户名： root
            🔒 密码： 无
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
