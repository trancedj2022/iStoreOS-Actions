name: 🚀 iStoreOS 完整构建流程
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "1、ImageBuilder 版本"
        required: true
        default: '20260731'
        type: choice
        options:
          - '20260731'
          - '20260320'
          - '20251231'
          - '20251226'
      network_settings:
        description: "2、初始网络配置（rootfs 与最终固件统一）"
        required: true
        default: 'dhcp'
        type: choice
        options:
          - 'static'
          - 'dhcp'
      ipaddr:
        description: '3、管理 IP（选择 static 时必填）'
        required: true
        default: '192.168.8.200'
      gateway:
        description: '4、默认网关（选择 static 时必填）'
        required: true
        default: '192.168.8.1'
      openwrt_board:
        description: "5、目标设备型号"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: choice
        options:
          - a311d
      openwrt_kernel:
        description: "6、内核版本"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核（未匹配则自动）"
        required: false
        default: false
        type: boolean

env:
  VERSION: 24.10.5

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/${{ github.actor }}/iStoreOS-Actions/releases/download/iStoreOS-${{ env.VERSION }}-${{ inputs.openwrt_rootfs }}-${{ inputs.network_settings }}/istoreos-armsr-armv8-generic-rootfs.tar.gz

      - name: 🔍 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT
          echo "rootfs_dir=$(dirname $ROOTFS_FILE)" >> $GITHUB_OUTPUT

      # ========== 手动执行 ophub 打包（修复 cp 错误） ==========
      - name: 🧰 克隆并修复 ophub 脚本
        run: |
          git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-openwrt.git /tmp/ophub
          cd /tmp/ophub
          # 修复所有 cp --update= 错误
          find . -type f -name "*.sh" -exec sed -i 's/cp --update=/cp -u /g' {} \;
          chmod +x remake
          mkdir -p openwrt/out

      - name: 🧱 手动打包固件
        id: manual_package
        working-directory: /tmp/ophub
        run: |
          # 复制 rootfs 到预期位置
          mkdir -p openwrt-armsr
          cp -v "$GITHUB_WORKSPACE/${{ steps.find_rootfs.outputs.file }}" openwrt-armsr/istoreos-armsr-armv8-generic-rootfs.tar.gz

          # 组装参数
          BOARD="${{ inputs.openwrt_board }}"
          KERNEL="${{ inputs.openwrt_kernel }}"
          AUTO_KERNEL="${{ inputs.auto_kernel }}"
          KERNEL_REPO="ophub/kernel"
          KERNEL_USAGE="stable"
          BUILDER_NAME="kwonelee"
          IPADDR="192.168.1.1"   # 默认IP，可根据需要调整

          CMD="sudo ./remake"
          CMD+=" -b ${BOARD}"
          CMD+=" -r ${KERNEL_REPO}"
          CMD+=" -u ${KERNEL_USAGE}"
          [ -n "${KERNEL}" ] && CMD+=" -k ${KERNEL}"
          [ "${AUTO_KERNEL}" = "true" ] && CMD+=" -a true" || CMD+=" -a false"
          CMD+=" -p ${IPADDR}"
          [ -n "${BUILDER_NAME}" ] && CMD+=" -n ${BUILDER_NAME}"

          echo "执行命令: $CMD"
          eval $CMD

          echo "执行命令: $CMD"
          eval $CMD

          # 将输出复制到工作区根目录，以便后续步骤使用
          mkdir -p /home/runner/work/iStoreOS-Actions/iStoreOS-Actions/firmware-out
          cp -v openwrt/out/*.img* /home/runner/work/iStoreOS-Actions/iStoreOS-Actions/firmware-out/ || true

      - name: 🔓 修复输出目录权限
        run: |
          sudo chown -R runner:docker /tmp/ophub/openwrt/out
          sudo chmod -R 755 /tmp/ophub/openwrt/out

      # 设置 PACKAGED_OUTPUTPATH 环境变量，兼容原重命名和上传步骤
      - name: 📤 设置输出路径环境变量
        run: |
          echo "PACKAGED_OUTPUTPATH=/home/runner/work/iStoreOS-Actions/iStoreOS-Actions/firmware-out" >> $GITHUB_ENV
          echo "PACKAGED_STATUS=success" >> $GITHUB_ENV

      - name: 📜 调整.img.gz 文件名
        id: rename
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            echo "Processing file: $FILE"
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}/g')
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed $FILENAME to $NEW_FILENAME"
            else
              echo "No need to rename $FILENAME"
            fi
          done

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-${{ inputs.openwrt_rootfs }}-${{ inputs.network_settings }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
