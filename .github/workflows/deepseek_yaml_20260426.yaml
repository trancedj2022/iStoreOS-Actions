name: 💿 Build iStoreOS (Rootfs + Firmware)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式"
        required: true
        default: "both"
        type: choice
        options:
          - rootfs-only
          - firmware-only
          - both

      # ---------- Rootfs 参数 ----------
      build_version:
        description: "1、Rootfs 构建版本 (ImageBuilder 日期)"
        required: true
        default: '20260731'
        type: choice
        options:
          - '20260731'
          - '20260703'
          - '20260605'
          - '20260417'
      network_settings:
        description: "2、初始网络配置"
        required: true
        default: 'dhcp'
        type: choice
        options:
          - 'static'
          - 'dhcp'
      ipaddr:
        description: '3、静态 IP（static 模式必填）'
        required: true
        default: '192.168.5.88'
      gateway:
        description: '4、静态网关（static 模式必填）'
        required: true
        default: '192.168.5.1'

      # ---------- 固件参数 ----------
      openwrt_board:
        description: "5、设备型号"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: choice
        options:
          # 此处请粘贴您原 St2 中的所有选项（为节省篇幅省略，实际使用时必须补全）
          - a311d
          - nsy-g16-plus_nsy-g68-plus_bdy-g18-pro
          - s905d_s905x3_s912_s922x-ct2000
      openwrt_kernel:
        description: "6、内核版本"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核（未匹配则自动）"
        required: false
        default: true
        type: boolean

env:
  VERSION: 24.10.8

# 赋予 Release 写入权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v3

      # ======================== Rootfs 构建 ========================
      - name: ⚙️ 设置可执行权限
        if: contains(fromJSON('["rootfs-only","both"]'), inputs.build_mode)
        run: |
          chmod +x arm64/build24.sh
          chmod +x shell/*.sh

      - name: ⚙️ 设置 IP、网关和版本号
        if: contains(fromJSON('["rootfs-only","both"]'), inputs.build_mode)
        run: |
          sed -i "s/版本号/${{ env.VERSION }}/g" "./files/etc/uci-defaults/99-custom.sh"
          sed -i "s/版本号/${{ env.VERSION }}/g" "./files/etc/banner"
          CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
          if [ "${{ inputs.network_settings }}" = "static" ]; then
             sed -i '34,111d' "$CONFIG_PATH"
             sed -i "/ipaddr/s/192.168.5.88/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
             sed -i "/gateway/s/192.168.5.1/${{ inputs.gateway }}/g" "$CONFIG_PATH"
          else
             sed -i '26,32d' "$CONFIG_PATH"
          fi
          cat "$CONFIG_PATH"

      - name: ⏬ 安装依赖
        if: contains(fromJSON('["rootfs-only","both"]'), inputs.build_mode)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zstd curl unzip tree

      - name: ⏬ 下载 ImageBuilder
        if: contains(fromJSON('["rootfs-only","both"]'), inputs.build_mode)
        run: |
          curl -L -o imagebuilder.tar.zst https://github.com/Kwonelee/iStoreOS-Actions/releases/download/iStoreOS-ImageBuilder/${{ inputs.build_version }}-istoreos-imagebuilder-armsr-armv8.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
          mv istoreos-imagebuilder-* imagebuilder

      - name: ⏬ 复制并设置必备文件
        if: contains(fromJSON('["rootfs-only","both"]'), inputs.build_mode)
        run: |
          cp arm64/build24.sh imagebuilder/
          cp shell/*-packages.sh imagebuilder/
          find files/packages/ -name "*.ipk" -exec cp {} imagebuilder/packages/ \;
          mkdir -p imagebuilder/files/etc/{uci-defaults,banner1}
          cp files/etc/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
          cp files/etc/banner imagebuilder/files/etc/banner1/
          cp files/etc/rc.local imagebuilder/files/etc/
          cd imagebuilder
          sed -i 's/# CONFIG_TARGET_ROOTFS_TARGZ is not set/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
          sed -i "s|CONFIG_TARGET_ROOTFS_SQUASHFS=.*|# CONFIG_TARGET_ROOTFS_SQUASHFS is not set|g" .config
          sed -i "s|CONFIG_TARGET_IMAGES_GZIP=.*|# CONFIG_TARGET_IMAGES_GZIP is not set|g" .config

      - name: 🧱 构建 iStoreOS-rootfs
        if: contains(fromJSON('["rootfs-only","both"]'), inputs.build_mode)
        working-directory: ./imagebuilder
        run: |
          bash ./build24.sh
          # 创建统一存放目录
          mkdir -p ${{ github.workspace }}/bin/targets/armsr/armv8
          # 复制生成的 rootfs 到统一位置
          cp bin/targets/armsr/armv8/*generic-rootfs.tar.gz ${{ github.workspace }}/bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz
          echo "ROOTFS_FILE=bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "✅ Rootfs 已统一存放"

      # 如果仅构建固件，从 Release 下载已有 rootfs
      - name: ⏬ 下载已有 rootfs（仅固件模式）
        if: inputs.build_mode == 'firmware-only'
        run: |
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz \
            https://github.com/${{ github.actor }}/iStoreOS-Actions/releases/download/iStoreOS-${{ env.VERSION }}-${{ inputs.network_settings }}/istoreos-armsr-armv8-generic-rootfs.tar.gz
          echo "ROOTFS_FILE=bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "✅ 已下载 rootfs"

      # ======================== 固件构建 ========================
      - name: 🧱 打包 iStoreOS 固件
        if: contains(fromJSON('["firmware-only","both"]'), inputs.build_mode)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ env.ROOTFS_FILE }}   # 现在路径一定存在
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 调整固件文件名
        if: contains(fromJSON('["firmware-only","both"]'), inputs.build_mode)
        id: rename_firmware
        run: |
          # 检查固件目录是否存在
          if [ -d "${{ env.PACKAGED_OUTPUTPATH }}" ]; then
            for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
              [ -e "$FILE" ] || continue
              FILENAME=$(basename "$FILE")
              NEW_FILENAME=$(echo "$FILENAME" | sed "s/openwrt/istoreos_${{ env.VERSION }}/g")
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed $FILENAME -> $NEW_FILENAME"
            done
          else
            echo "⚠️ 固件目录不存在，可能构建失败"
          fi

      # ======================== 上传产物 ========================
      - name: 📦 上传到 Release
        if: always() && (success() || failure())  # 即使部分失败也尝试上传已有产物
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-${{ inputs.network_settings }}
          body: |
            📌 版本： iStoreOS-${{ env.VERSION }}-RELEASE（${{ inputs.build_mode }} 模式构建）
            
            📂 来源： https://fw.koolcenter.com/iStoreOS/ib/armsr/
            🧠 内核： 请登录 iStoreOS → System → Amlogic Service → 更换内核
            🧩 集成： 包含基础组件、驱动、网络工具、容器、LuCI 及插件
            👤 用户名： root
            🔒 密码： 无
            🌐 IP： ${{ inputs.network_settings == 'static' && inputs.ipaddr || '动态获取（单网口）/ 192.168.100.1（多网口）' }}
          files: |
            bin/targets/armsr/armv8/*rootfs.tar.gz
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 使用内置 token
