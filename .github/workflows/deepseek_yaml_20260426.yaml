name: 💿 Build iStoreOS (Rootfs + Firmware)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式"
        required: true
        default: "both"
        type: choice
        options:
          - rootfs-only     # 仅构建通用 rootfs
          - firmware-only   # 仅基于已有 rootfs 构建设备固件
          - both            # 完整构建（先 rootfs 后固件）

      # ---------- Rootfs 相关参数 ----------
      build_version:
        description: "1、Rootfs 构建版本 (ImageBuilder 日期)"
        required: true
        default: '20260731'
        type: choice
        options:
          - '20260731'
          - '20260703'
          - '20260605'
          - '20260417'
      network_settings:
        description: "2、初始网络配置"
        required: true
        default: 'dhcp'
        type: choice
        options:
          - 'static'
          - 'dhcp'
      ipaddr:
        description: '3、静态 IP（static 模式必填）'
        required: true
        default: '192.168.5.88'
      gateway:
        description: '4、静态网关（static 模式必填）'
        required: true
        default: '192.168.5.1'

      # ---------- 固件相关参数 ----------
